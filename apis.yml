aid: khosla-ventures
name: Khosla Ventures
description: >-
  Khosla Ventures is a Menlo Park, California venture capital firm founded in 2004
  by Sun Microsystems co-founder Vinod Khosla. The firm backs bold, early, and
  impactful ventures, favoring contrarian deep-tech bets with world-class teams and
  a conviction-driven approach that deliberately accepts a high failure rate to
  capture transformative outcomes. Khosla invests across seed, early (Series A/B),
  and growth stages through its Seed Fund, Main Fund, and Opportunity (growth) Fund,
  writing checks that range from small seed positions to large growth rounds. Focus
  sectors span artificial intelligence, enterprise and consumer software, financial
  services and fintech, robotics and frontier/deep tech, aerospace and defense,
  climate and sustainability (clean energy, fusion, materials, agriculture), and
  digital health, medtech, diagnostics, and therapeutics. The firm manages roughly
  $16 billion in assets as of 2025 and is known for early investments in OpenAI,
  Stripe, Square/Block, DoorDash, Instacart, Affirm, Impossible Foods, GitLab, Okta,
  Rocket Lab, and QuantumScape. Headquarters are at 2128 Sand Hill Road, Menlo Park,
  CA, with a primarily United States geographic focus and select global investments.
